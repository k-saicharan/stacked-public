<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked</title>
  <meta name="description" content="Download Stacked." />
  <style>
    :root {
      --bg: #0b0e14;
      --card: #1c2433;
      --line: #2e3a4f;
      --text: #e8eef7;
      --muted: #8b9bb0;
      --accent: #3ddcff;
      --on-accent: #041018;
      --ok: #3ddb8a;
      --bad: #ff5c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .thanks {
      color: var(--muted);
      margin-bottom: 24px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: none;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      padding: 16px 18px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
      margin-bottom: 8px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 16px;
    }
    .card p {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .opt {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 0.9rem;
      color: var(--text);
      margin: 10px 0;
    }
    .opt input { margin-top: 3px; accent-color: var(--accent); }
    label.field {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    input[type="email"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status { font-size: 0.85rem; min-height: 1.2em; margin-top: 10px; }
    .ok { color: var(--ok); }
    .err { color: var(--bad); }
    .hp { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Stacked</h1>
    <p class="thanks">Thanks for downloading the app.</p>

    <a class="btn btn-primary" id="apk" rel="noopener">Download the app</a>
    <p class="hint">Android APK. Allow install from this browser if asked.</p>

    <section class="card">
      <p>Feel free to agree to any of these so we can improve the app.</p>
      <form id="form" novalidate>
        <label class="opt">
          <input type="checkbox" id="play" />
          <span>Add my Google email to the Play Store tester list.</span>
        </label>
        <label class="opt">
          <input type="checkbox" id="totals" />
          <span>I am willing to share anonymous shift totals from inside the app. Notes stay on the phone.</span>
        </label>
        <label class="opt">
          <input type="checkbox" id="updates" />
          <span>You can email me about this pilot.</span>
        </label>

        <label class="field" for="email">Google email</label>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" />
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@gmail.com" />
        <button type="submit" class="btn btn-primary" id="save">Save</button>
        <p class="status" id="status" role="status"></p>
      </form>
    </section>
  </div>

  <script>
    const APK = 'https://github.com/k-saicharan/stacked-public/releases/latest/download/app-release.apk';
    const MAIL = 'saicharan9977@gmail.com';
    document.getElementById('apk').href = APK;

    const form = document.getElementById('form');
    const emailEl = document.getElementById('email');
    const statusEl = document.getElementById('status');
    const saveBtn = document.getElementById('save');

    function validEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.className = 'status';
      statusEl.textContent = '';

      const email = (emailEl.value || '').trim().toLowerCase();
      const play = document.getElementById('play').checked;
      const totals = document.getElementById('totals').checked;
      const updates = document.getElementById('updates').checked;
      const honey = (form.querySelector('[name="website"]').value || '').trim();

      if (honey) return;

      if (!play && !totals && !updates) {
        statusEl.className = 'status err';
        statusEl.textContent = 'Tick at least one box, or just download the app above.';
        return;
      }
      if (!validEmail(email)) {
        statusEl.className = 'status err';
        statusEl.textContent = 'Enter the Google email on your Play Store.';
        emailEl.focus();
        return;
      }

      saveBtn.disabled = true;
      statusEl.textContent = 'Saving…';

      const payload = {
        email,
        play_tester: play ? 'yes' : 'no',
        share_totals: totals ? 'yes' : 'no',
        pilot_email: updates ? 'yes' : 'no',
        _subject: 'Stacked pilot signup',
      };

      try {
        const res = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(MAIL), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          body: JSON.stringify(payload),
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok) {
          statusEl.className = 'status ok';
          statusEl.textContent = body.message && /confirm/i.test(body.message)
            ? 'Saved. If this is the first signup, confirm the email that just arrived, then later signups land automatically.'
            : 'Saved. Thanks.';
          try { localStorage.setItem('stacked_pilot_email', email); } catch (_) {}
        } else {
          throw new Error(String(res.status));
        }
      } catch (err) {
        const q = new URLSearchParams({
          subject: 'Stacked pilot',
          body: 'Email: ' + email + '\nPlay tester: ' + (play ? 'yes' : 'no') + '\nShare totals: ' + (totals ? 'yes' : 'no') + '\nUpdates: ' + (updates ? 'yes' : 'no'),
        });
        statusEl.className = 'status err';
        statusEl.innerHTML = 'Could not save automatically. <a href="mailto:' + MAIL + '?' + q.toString() + '" style="color:var(--accent)">Tap here to send it</a>. The download above still works.';
      } finally {
        saveBtn.disabled = false;
      }
    });

    try {
      const prev = localStorage.getItem('stacked_pilot_email');
      if (prev) emailEl.value = prev;
    } catch (_) {}
  </script>
</body>
</html>
