<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked QR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    body {
      display: grid;
      place-items: center;
      font: 16px/1.4 system-ui, sans-serif;
      color: #111;
    }
    img { width: min(86vw, 86vh, 520px); height: auto; }
    p { margin: 12px 0 0; color: #444; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <img src="qr.png" alt="QR code for Stacked download page" />
    <p>Scan to download Stacked</p>
  </div>
</body>
</html>
